[pytest]
# Collect hyphenated test files too. Historically only test_*.py was collected,
# so ~15 test-*.py files (the migrate-taxonomy and orchestrator suites, ~440
# tests) silently never ran. test-* is included so those suites are exercised
# and regressions in them are caught.
python_files = test_*.py *_test.py test-*.py
