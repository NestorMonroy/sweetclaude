# SweetClaude capability manifest
# Central source for release-channel facts and safety gates that should be
# shared by update, doctor, migrate, recover, status, and release tooling.
schema_version: 1

channels:
  stable:
    branch: stable-3.x
    major_version: 3
    expected_marketplace: sweetclaude-stable
    prerelease_required: false
    prerelease_allowed: false

  beta:
    branch: beta-4.x
    major_version: 4
    expected_marketplace: sweetclaude-beta
    prerelease_required: true
    prerelease_allowed: true
    minimum_safe_version: 4.1.9-beta

release:
  required_evidence_checks:
    - tests
    - channel-isolation
    - installation-smoke
    - static-checks
    - release-metadata
    - manifest-validation
    - release-identity
    - docs-capability
    - public-distribution

capabilities:
  recover.stabilize_without_migration:
    title: Stabilize recoverable legacy layout without taxonomy migration
    delegate_skill: sweetclaude:recover
    command_entrypoint:
      slash_command: /sweetclaude:recover
      script: scripts/recovery/recover_project.py
      module: recovery.recover_project
    supports_project_shapes:
      - recovery_required
    mutation_class: planned_write
    mutates_project: true
    requires_approval: true
    required_preconditions:
      - project guard status is run-recover
      - recovery plan exists before execute
    snapshot_scope_hints:
      - .sweetclaude/
      - docs/product/
    postconditions:
      - id: recovery-postconditions
        check: recovery verifier reports stabilized state
    rollback_support:
      supported: true
      command: "python3 scripts/recovery/recover_project.py rollback --project-dir <project>"
      limitations: []
    unsupported_states:
      - condition: manual_escalation
        behavior: escalate
      - condition: missing_product_base
        behavior: diagnose_only
    version_metadata:
      introduced_in: 4.1.0-beta
      deprecated_in: null
    safety_contract:
      - diagnose
      - plan
      - snapshot
      - verify-snapshot
      - approve
      - execute
      - record-progress
      - resume
      - verify-postconditions
      - rollback
    verification_commands:
      - "python3 scripts/recovery/recover_project.py diagnose --project-dir <project>"
      - "python3 scripts/recovery/recover_project.py plan --project-dir <project>"

  migrate.flat_bl_to_issue:
    title: Migrate flat BL-NNN backlog to ISSUE taxonomy
    delegate_skill: sweetclaude:migrate
    executable: scripts/migrate/migrate-v3-to-v4.py
    command_entrypoint:
      slash_command: /sweetclaude:migrate
      script: scripts/migrate/migrate-v3-to-v4.py
      module: null
    supports_project_shapes:
      - flat_bl_backlog
    mutation_class: planned_write
    mutates_project: true
    requires_approval: true
    preflight_required: true
    required_preconditions:
      - project shape is flat_bl_backlog
      - migration preflight passes
      - user approval is bound to current plan
    snapshot_scope_hints:
      - .sweetclaude/product/backlog/
      - .sweetclaude/state/
    postconditions:
      - id: issue-taxonomy-created
        check: migrated ISSUE files and migration map exist
      - id: migration-integrity
        check: execution manifest contains source and created file integrity
    rollback_support:
      supported: true
      command: "python3 scripts/migrations/run_rollback.py --project-dir <project>"
      limitations: []
    unsupported_states:
      - condition: typed_legacy_backlog
        behavior: block
      - condition: recovery_required
        behavior: diagnose_only
      - condition: manual_escalation
        behavior: escalate
    version_metadata:
      introduced_in: 4.0.0-beta
      deprecated_in: null
    safety_contract:
      - diagnose
      - preflight
      - plan
      - snapshot
      - approve
      - execute
      - verify-postconditions
      - rollback
    verification_commands:
      - "python3 scripts/migrate/migrate-v3-to-v4.py preflight --project-dir <project>"

  migrate.typed_legacy_backlog:
    title: Typed legacy backlog migration
    supported: true
    delegate_skill: sweetclaude:migrate
    command_entrypoint:
      slash_command: /sweetclaude:migrate
      script: scripts/migrate/migrate_taxonomy.py
      module: migrate.migrate_taxonomy
    supports_project_shapes:
      - typed_legacy_backlog
    mutation_class: planned_write
    mutates_project: true
    requires_approval: true
    rollback_support:
      supported: true
      command: "python3 scripts/migrate/migrate_taxonomy.py --rollback --project-dir <project>"
      limitations: []
    required_preconditions:
      - project shape is typed_legacy_backlog
      - no real duplicate ids present
    snapshot_scope_hints:
      - docs/product/
      - .sweetclaude/product/
    postconditions:
      - id: old-prefix-files-removed
        check: no old-prefix files remain on disk
    version_metadata:
      introduced_in: 4.3.0-beta
      deprecated_in: null
    safety_contract:
      - diagnose
      - dry-run
      - snapshot
      - approve
      - execute
      - verify-postconditions
      - rollback
    verification_commands:
      - "python3 scripts/migrate/migrate_taxonomy.py --dry-run --project-dir <project>"

  recover.graduate_from_compatibility:
    title: Graduate from compatibility mode
    supported: true
    delegate_skill: sweetclaude:recover
    command_entrypoint:
      slash_command: /sweetclaude:doctor
      script: scripts/recovery/recover_project.py
      module: recovery.recover_project
    supports_project_shapes:
      - accepted_legacy_taxonomy
      - typed_legacy_backlog
      - graduation_candidate
    mutation_class: planned_write
    mutates_project: true
    requires_approval: true
    required_preconditions:
      - project is in compatibility mode or accepted legacy taxonomy
      - graduation-check passes (v4-compliant)
    snapshot_scope_hints:
      - .sweetclaude/state/sweetclaude.yaml
    postconditions:
      - id: graduation-state-written
        check: recovery.taxonomy.status is graduated and framework.migration_status is complete
    rollback_support:
      supported: true
      command: "python3 scripts/recovery/recover_project.py rollback-graduation --project-dir <project>"
      limitations: []
    unsupported_states:
      - condition: old_prefix_files_remain
        behavior: block
      - condition: duplicate_ids
        behavior: block
      - condition: frontmatter_parse_errors
        behavior: block
    version_metadata:
      introduced_in: 4.2.6-beta
      deprecated_in: null
    safety_contract:
      - diagnose
      - validate
      - snapshot
      - approve
      - execute
      - verify-postconditions
      - rollback
    verification_commands:
      - "python3 scripts/recovery/recover_project.py graduation-check --project-dir <project>"

  doctor.compatibility_mode:
    title: Continue in compatibility mode
    supports_project_shapes:
      - accepted_legacy_taxonomy
    mutates_project: false
    requires_approval: false

  doctor.fix_graduation_blockers:
    title: Fix graduation blockers
    supported: true
    delegate_skill: sweetclaude:doctor
    command_entrypoint:
      slash_command: /sweetclaude:doctor
      script: scripts/recovery/recover_project.py
      module: recovery.recover_project
    supports_project_shapes:
      - graduation_blocked
    mutation_class: planned_write
    mutates_project: true
    requires_approval: true
    required_preconditions:
      - project is in compatibility mode or accepted legacy taxonomy
      - graduation-check reports validation-failures with resolvable blockers
    snapshot_scope_hints:
      - product work-item files named in each blocker resolution
    postconditions:
      - id: graduation-unblocked
        check: graduation-check reports graduation_allowed true
    rollback_support:
      supported: true
      command: "python3 scripts/doctor.py restore --project-dir <project> --archive-dir <archive>"
      limitations: []
    version_metadata:
      introduced_in: 4.2.8-beta
      deprecated_in: null
    safety_contract:
      - diagnose
      - validate
      - snapshot
      - approve
      - execute
      - verify-postconditions
      - rollback
    verification_commands:
      - "python3 scripts/recovery/recover_project.py graduation-check --project-dir <project>"

  doctor.manual_review:
    title: Manual maintenance review
    supports_project_shapes:
      - manual_escalation
      - missing_product_base
    mutates_project: false
    requires_approval: false

  update.framework_sync:
    title: Framework/plugin update without project artifact migration
    supports_project_shapes:
      - current_layout
      - accepted_legacy_taxonomy
      - flat_bl_backlog
      - recovery_required
      - manual_escalation
      - missing_product_base
    mutates_project: false
    mutates_global_config: true
    requires_approval: true

project_shapes:
  recovery_required:
    guard_status: run-recover
    migrate_allowed: false
    message: "This project is in a recoverable SweetClaude migration/update state. Run /sweetclaude:recover before any taxonomy migration."
    recovery_route: stabilize-without-migration
    recovery_capability: recover.stabilize_without_migration

  manual_escalation:
    guard_status: manual-review
    migrate_allowed: false
    message: "This project needs manual SweetClaude recovery review before migration or other maintenance commands."
    doctor_capability: doctor.manual_review

  accepted_legacy_taxonomy:
    guard_status: compatibility-mode
    migrate_allowed: false
    message: "This project has an accepted legacy taxonomy layout. Do not run /sweetclaude:migrate unless a future layout-specific migration plan explicitly allows it."
    doctor_capability: doctor.compatibility_mode
    graduation_capability: recover.graduate_from_compatibility

  graduation_candidate:
    guard_status: graduation-available
    migrate_allowed: false
    message: "This project is v4-compliant and can graduate from compatibility mode."
    graduation_capability: recover.graduate_from_compatibility

  graduation_blocked:
    guard_status: graduation-blocked
    migrate_allowed: false
    message: "This project could graduate from compatibility mode, but validation blockers must be fixed first. Each blocker carries its resolution."
    blocker_fix_capability: doctor.fix_graduation_blockers
    graduation_capability: recover.graduate_from_compatibility

  flat_bl_backlog:
    migration: flat_bl_to_issue
    guard_status: migration-may-be-needed
    migrate_allowed: true
    message: "Old-format work items were found and no recovery-only state was detected. Review /sweetclaude:migrate before executing it."
    migration_capability: migrate.flat_bl_to_issue

  typed_legacy_backlog:
    guard_status: supported-migration-available
    migrate_allowed: true
    migration_capability: migrate.typed_legacy_backlog
    message: "This project has a typed legacy backlog layout. Run /sweetclaude:migrate to migrate to the unified ISSUE-NNN taxonomy."

  missing_product_base:
    guard_status: missing-product-base
    migrate_allowed: false
    message: "SweetClaude product artifacts were not found. Run /sweetclaude:doctor or /sweetclaude:setup instead of migration."
    doctor_capability: doctor.manual_review

  current_layout:
    guard_status: ok
    migrate_allowed: false
    message: "No SweetClaude migration or recovery guard is currently active."
